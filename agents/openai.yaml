version: 1
display_name: Rakuten Shop Analysis
short_description: Analyze a Rakuten shop by URL or shop code through the hosted backend.
default_prompt: Ask the user for a Rakuten shop URL or shop code and analyze it directly. Use the bundled scripts/run.mjs path for execution. Do not ask normal users to set RAKUTEN_SKILL_API_BASE_URL unless they explicitly want advanced configuration, and do not invent custom API hosts, /analyze endpoints, or ad-hoc bash/Node request scripts.
